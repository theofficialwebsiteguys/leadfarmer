# ============================================================================
# LOCAL DEVELOPMENT ONLY — this file is never deployed.
#
# It runs the same stack the site uses in production (Apache + PHP + MariaDB)
# so you can work on the site and the admin dashboard without installing PHP or
# MySQL on your machine.
#
#   npm run dev:api          start the backend on http://localhost:8000
#   npm run dev:create-admin create your dashboard login (first time only)
#   npm start                start Angular on http://localhost:4200
#
# Angular's proxy (proxy.conf.json) forwards /api and /uploads to port 8000, so
# the browser sees a single origin and session cookies behave exactly as they do
# on the real server.
#
# The database is seeded automatically on first start from api/database/. To
# wipe it and start over:  npm run dev:api:reset
# ============================================================================

services:
  db:
    image: mariadb:10.11
    container_name: leadfarmer-db
    environment:
      MARIADB_ROOT_PASSWORD: devroot
      MARIADB_DATABASE: leadfarmer
      MARIADB_USER: leadfarmer
      MARIADB_PASSWORD: devpassword
    ports:
      # Exposed so you can connect a GUI client (TablePlus, DBeaver, …) if you want.
      - "33061:3306"
    volumes:
      - db-data:/var/lib/mysql
      # Run once, on first boot only, in filename order.
      - ./api/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./api/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    image: php:8.2-apache
    container_name: leadfarmer-api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:80"
    volumes:
      - ./api:/var/www/html/api
      - ./uploads:/var/www/html/uploads
      - ./docker/dev-config.php:/leadfarmer-config/config.php:ro
    environment:
      LEADFARMER_CONFIG: /leadfarmer-config/config.php
    command: >
      bash -c "
        docker-php-ext-install pdo_mysql > /dev/null 2>&1;
        a2enmod rewrite headers > /dev/null 2>&1;
        sed -i 's/AllowOverride None/AllowOverride All/g' /etc/apache2/apache2.conf;
        apache2-foreground
      "

volumes:
  db-data:
