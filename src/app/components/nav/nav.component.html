<nav class="nav" [class.scrolled]="scrolled" [class.menu-open]="menuOpen" role="navigation" aria-label="Main navigation">

  <!-- Fades out once scrolled (nav goes solid white); keeps the logo/links
       legible over whatever frame of the hero video is playing behind it -->
  <div class="nav__scrim" aria-hidden="true"></div>

  <a routerLink="/" class="nav__logo-link" aria-label="Lead Farmer — home">
    <img
      [src]="logo.url"
      [alt]="logo.alt || 'Lead Farmer'"
      class="nav__logo"
    >
  </a>

  <!-- Desktop links -->
  <ul class="nav__links" role="list">
    <li>
      <a
        routerLink="/story"
        routerLinkActive="nav__link--active"
        [routerLinkActiveOptions]="{ exact: false }"
        class="nav__link"
      >{{ links.story }}</a>
    </li>
    <li>
      <a
        routerLink="/strains"
        routerLinkActive="nav__link--active"
        [routerLinkActiveOptions]="{ exact: false }"
        class="nav__link"
      >{{ links.strains }}</a>
    </li>
    <li><a routerLink="/" fragment="photos" class="nav__link">{{ links.gallery }}</a></li>
    <li><a routerLink="/" fragment="articles" class="nav__link">{{ links.articles }}</a></li>
    <li>
      <a
        routerLink="/merch"
        routerLinkActive="nav__link--active"
        [routerLinkActiveOptions]="{ exact: false }"
        class="nav__link"
      >{{ links.merch }}</a>
    </li>
    <li><a routerLink="/" fragment="contact" class="nav__link">{{ links.contact }}</a></li>
  </ul>

  <!-- Mobile hamburger -->
  <button
    class="nav__hamburger"
    type="button"
    [attr.aria-expanded]="menuOpen"
    aria-controls="nav-mobile-menu"
    aria-label="Toggle navigation menu"
    (click)="toggleMenu()"
  >
    <span class="nav__bar" aria-hidden="true"></span>
    <span class="nav__bar" aria-hidden="true"></span>
    <span class="nav__bar" aria-hidden="true"></span>
  </button>

  <!-- Mobile menu — full-screen takeover -->
  <div
    id="nav-mobile-menu"
    class="nav__mobile-menu"
    [class.open]="menuOpen"
    role="menu"
  >
    <a
      routerLink="/story"
      routerLinkActive="nav__mobile-link--active"
      [routerLinkActiveOptions]="{ exact: false }"
      class="nav__mobile-link"
      role="menuitem"
      (click)="closeMenu()"
    >{{ links.story }}</a>
    <a
      routerLink="/strains"
      routerLinkActive="nav__mobile-link--active"
      [routerLinkActiveOptions]="{ exact: false }"
      class="nav__mobile-link"
      role="menuitem"
      (click)="closeMenu()"
    >{{ links.strains }}</a>
    <a routerLink="/" fragment="photos" class="nav__mobile-link" role="menuitem" (click)="closeMenu()">{{ links.gallery }}</a>
    <a routerLink="/" fragment="articles" class="nav__mobile-link" role="menuitem" (click)="closeMenu()">{{ links.articles }}</a>
    <a
      routerLink="/merch"
      routerLinkActive="nav__mobile-link--active"
      [routerLinkActiveOptions]="{ exact: false }"
      class="nav__mobile-link"
      role="menuitem"
      (click)="closeMenu()"
    >{{ links.merch }}</a>
    <a routerLink="/" fragment="contact" class="nav__mobile-link" role="menuitem" (click)="closeMenu()">{{ links.contact }}</a>
  </div>

</nav>
