<section class="product-hero">

  <div class="product-hero__gallery">
    <app-product-gallery [images]="galleryImages" [productName]="strain.name" />
  </div>

  <div class="product-hero__info">
    <h1 class="product-hero__name">{{ strain.name }}</h1>

    <p class="product-hero__desc">{{ strain.shortDescription }}</p>

    <div class="product-hero__ctas">
      <a
        routerLink="/"
        fragment="contact"
        [queryParams]="wholesaleQueryParams"
        class="btn btn--outline"
      >{{ wholesaleLabel }}</a>
    </div>
  </div>

</section>
