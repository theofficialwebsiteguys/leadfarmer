<section class="merch">
  <div class="merch__inner">
    <p class="section-label">Wear The Brand</p>
    <h1 class="section-heading">Merch</h1>
    <p class="merch__intro">
      Hats, tees, and more — our full merch lineup lives on our online store. Head over there to shop.
    </p>

    <a
      class="btn btn--black merch__cta"
      [href]="storeUrl"
      target="_blank"
      rel="noopener noreferrer"
    >
      Shop Merch
    </a>
  </div>
</section>
