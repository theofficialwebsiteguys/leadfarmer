<section class="strain-catalog">
  <div class="strain-catalog__inner">

    <div class="strain-catalog__header">
      <p class="section-label">{{ pageEyebrow }}</p>
      <h1 class="section-heading">{{ pageHeading }}</h1>
      <p class="strain-catalog__intro">{{ pageIntro }}</p>
    </div>

    <p class="strain-catalog__count">
      Showing {{ strains.length }} {{ strains.length === 1 ? 'strain' : 'strains' }}
    </p>

    <app-strain-grid
      [strains]="strains"
      [cardHeadingLevel]="2"
      [cardRevealOnScroll]="false"
      emptyHeading="No Strains Yet"
      emptyMessage="There is nothing in the menu right now. Check back soon."
      emptyActionLabel="Back to Home"
      emptyActionLink="/"
    />

  </div>
</section>
