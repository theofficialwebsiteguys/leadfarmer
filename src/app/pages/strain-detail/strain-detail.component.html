@if (strain) {
  <div class="strain-detail">

    <nav class="breadcrumb strain-detail__breadcrumb" aria-label="Breadcrumb">
      <a routerLink="/strains" class="breadcrumb__link">All Strains</a>
      <span class="breadcrumb__sep" aria-hidden="true">/</span>
      <span class="breadcrumb__current" aria-current="page">{{ strain.name }}</span>
    </nav>

    <app-product-hero [strain]="strain" />

    <app-related-strains [strains]="relatedStrains" />

  </div>
} @else {
  <div class="strain-detail strain-detail--not-found">
    <h1 class="visually-hidden">Strain Not Found</h1>
    <app-empty-catalog-state
      heading="Strain Not Found"
      message="We couldn't find that strain. It may have been renamed or is no longer available."
      actionLabel="Browse All Strains"
      actionLink="/strains"
    />
  </div>
}
