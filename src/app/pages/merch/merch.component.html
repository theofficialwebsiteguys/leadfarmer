<section class="merch">
  <div class="merch__inner">
    <p class="section-label">{{ eyebrow }}</p>
    <h1 class="section-heading">{{ heading }}</h1>
    <p class="merch__intro">{{ intro }}</p>

    <a
      class="btn btn--black merch__cta"
      [href]="storeUrl"
      target="_blank"
      rel="noopener noreferrer"
    >
      {{ buttonLabel }}
    </a>
  </div>
</section>
